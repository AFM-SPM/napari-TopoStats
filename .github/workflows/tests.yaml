name: Run the pytest test suite

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - "**.csv"
      - "**.npy"
      - "**.out"
      - "**.pkl"
      - "**.png"
      - "**.py"
      - "**.toml"
      - "**.yaml"

jobs:
  build:
    name: Run pytest (${{ matrix.platform }} ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    env:
      QT_QPA_PLATFORM: offscreen
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_OPENGL: software
      XDG_RUNTIME_DIR: /tmp

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install and setup uv with python
        uses: astral-sh/setup-uv@v10.4.0
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
      - name: Setup PyVista headless display with Qt support
        uses: pyvista/setup-headless-display-action@v4
        with:
          qt: true
      - name: Install package dependencies in activated environment
        shell: bash
        run: |
          uv sync --frozen --all-extras --dev
      - name: Pytest
        run: |
          uv run pytest --cov=src --cov-branch --numprocesses=logical
      - name: Determine coverage
        if: runner.os == 'Linux'
        run: |
          coverage xml
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
