name: napari-TopoStats
display_name: TopoStats
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/manifest.html for valid categories
categories: ["Annotation", "Segmentation", "Acquisition"]
contributions:
  commands:
    - id: napari-TopoStats.get_reader
      python_name: napari_topostats._reader:napari_get_reader
      title: Open data with TopoStats

    - id: napari-TopoStats.make_3d_widget
      python_name: napari_topostats:show_3d_autogenerate_widget
      title: Turn 2D image into 3D stack

    - id: napari-TopoStats.flatten
      python_name: napari_topostats:flatten
      title: Run TopoStats flattening

    - id: napari-TopoStats.otsu
      python_name: napari_topostats:otsu
      title: Run TopoStats otsu thresholding

    - id: napari-TopoStats.scars_removal
      python_name: napari_topostats:scars_removal
      title: Run TopoStats scars removal

    - id: napari-TopoStats.background_average
      python_name: napari_topostats:background_average
      title: Run TopoStats background averaging

    - id: napari-TopoStats.untilt
      python_name: napari_topostats:untilt
      title: Run TopoStats tilt removal

    - id: napari-TopoStats.quadratic
      python_name: napari_topostats:quadratic
      title: Run TopoStats quadratic polynomial removal

    - id: napari-TopoStats.nonlinear
      python_name: napari_topostats:nonlinear
      title: Run TopoStats nonlinear polynomial removal

    - id: napari-TopoStats.write_multiple
      python_name: napari_topostats._writer:write_multiple
      title: Save multi-layer data with TopoStats

    - id: napari-TopoStats.write_single_image
      python_name: napari_topostats._writer:write_single_image
      title: Save image data with TopoStats

    - id: napari-TopoStats.make_sample_data
      python_name: napari_topostats._sample_data:make_sample_data
      title: Load sample data from TopoStats

    - id: napari-TopoStats.make_container_widget
      python_name: napari_topostats:ImageThreshold
      title: Make threshold Container widget

    - id: napari-TopoStats.make_magic_widget
      python_name: napari_topostats:threshold_magic_widget
      title: Make threshold magic widget

    - id: napari-TopoStats.make_qwidget
      python_name: napari_topostats:ExampleQWidget
      title: Make example QWidget

  readers:
    - command: napari-TopoStats.get_reader
      accepts_directories: false
      filename_patterns: ['*.spm', '*.jpk', '*.ibw', '*.gwy', '*.topostats']
  writers:
    - command: napari-TopoStats.write_multiple
      layer_types: ['image*','labels*']
      filename_extensions: []
  sample_data:
    - command: napari-TopoStats.make_sample_data
      display_name: TopoStats
      key: unique_id.1
  widgets:
    - command: napari-TopoStats.make_container_widget
      display_name: Container Threshold
    - command: napari-loadafm.make_magic_widget
      display_name: Magic Threshold

    - command: napari-TopoStats.make_3d_widget
      autogenerate: true
      display_name: 3D-ify Image

    - command: napari-TopoStats.flatten
      autogenerate: true
      display_name: Flatten image

    - command: napari-TopoStats.untilt
      autogenerate: true
      display_name: Apply tilt removal

    - command: napari-TopoStats.otsu
      autogenerate: true
      display_name: Apply Otsu Thresholding

    - command: napari-TopoStats.scars_removal
      autogenerate: true
      display_name: Remove Scars

    - command: napari-TopoStats.background_average
      autogenerate: true
      display_name: Average Background

    - command: napari-TopoStats.quadratic
      autogenerate: true
      display_name: Remove quadratic polynomial

    - command: napari-TopoStats.nonlinear
      autogenerate: true
      display_name: Remove nonlinear polynomial

    - command: napari-TopoStats.make_qwidget
      display_name: Example QWidget
