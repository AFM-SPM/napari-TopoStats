name: napari-TopoStats
display_name: TopoStats
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/manifest.html for valid categories
categories: ["Annotation", "Segmentation", "Acquisition"]
contributions:
  commands:
    - id: napari-TopoStats.get_reader
      python_name: napari_topostats._reader:napari_get_reader
      title: Open data with TopoStats

    - id: napari-TopoStats.make_3d_widget
      python_name: napari_topostats:show_3d_autogenerate_widget
      title: Turn 2D image into 3D stack
    
    - id: napari-TopoStats.remove_scars_from_image
      python_name: napari_topostats:remove_scars_from_image
      title: Remove scars from image

    - id: napari-TopoStats.median_align_rows
      python_name: napari_topostats:median_align_rows
      title: Align rows by row median

    - id: napari-TopoStats.remove_planar_tilt
      python_name: napari_topostats:remove_planar_tilt
      title: Planar tilt removal

    - id: napari-TopoStats.remove_quadratic_background
      python_name: napari_topostats:remove_quadratic_background
      title: Remove quadratic background

    - id: napari-TopoStats.remove_nonlinear_background
      python_name: napari_topostats:remove_nonlinear_background
      title: Remove nonlinear background

    - id: napari-TopoStats.zero_average_background
      python_name: napari_topostats:zero_average_background
      title: Zero average the background

    - id: napari-TopoStats.gaussian_filter_image
      python_name: napari_topostats:gaussian_filter_image
      title: Gaussian filter

    - id: napari-TopoStats.write_multiple
      python_name: napari_topostats._writer:write_multiple
      title: Save multi-layer data with TopoStats

    - id: napari-TopoStats.write_single_image
      python_name: napari_topostats._writer:write_single_image
      title: Save image data with TopoStats

    - id: napari-TopoStats.make_sample_data
      python_name: napari_topostats._sample_data:make_sample_data
      title: Load sample data from TopoStats

    - id: napari-TopoStats.make_container_widget
      python_name: napari_topostats:ImageThreshold
      title: Make threshold Container widget

  readers:
    - command: napari-TopoStats.get_reader
      accepts_directories: false
      filename_patterns: ['*.spm', '*.jpk', '*.ibw', '*.gwy', '*.topostats']
  writers:
    - command: napari-TopoStats.write_multiple
      layer_types: ['image*','labels*']
      filename_extensions: []
  sample_data:
    - command: napari-TopoStats.make_sample_data
      display_name: TopoStats
      key: unique_id.1
  widgets:
    - command: napari-TopoStats.make_container_widget
      display_name: Container Threshold

    - command: napari-TopoStats.make_3d_widget
      autogenerate: true
      display_name: 3D-ify Image

    - command: napari-TopoStats.remove_scars_from_image
      autogenerate: true
      display_name: Filters - Remove scars

    - command: napari-TopoStats.median_align_rows
      autogenerate: true
      display_name: Filters - Align rows

    - command: napari-TopoStats.remove_planar_tilt
      autogenerate: true
      display_name: Filters - Remove planar tilt

    - command: napari-TopoStats.remove_quadratic_background
      autogenerate: true
      display_name: Filters - Remove quadratic background

    - command: napari-TopoStats.remove_nonlinear_background
      autogenerate: true
      display_name: Filters - Remove nonlinear background

    - command: napari-TopoStats.zero_average_background
      autogenerate: true
      display_name: Filters - Zero background

    - command: napari-TopoStats.gaussian_filter_image
      autogenerate: true
      display_name: Filters - Gaussian filter
