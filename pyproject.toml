[build-system]
requires = [
  "setuptools>=45",
  "wheel",
  "setuptools_scm[toml]>=6.2"
]
build-backend = "setuptools.build_meta"

[project]
name = "napari-TopoStats"
description = "Napari plugin for TopoStats a suite of tools for working with Atomic Force Microscopy Images."
readme = "README.md"
license = {text = "GNU GPLv3 only"}
dynamic = ["version"]
authors = [
  {name = "Max Gamill", email = "mcgamill1@sheffield.ac.uk"},
  {name = "Aran Hobbs", email = "ahobbs834@gmail.com"},
  {name = "Laura Wiggins", email = "l.wiggins@sheffield.ac.uk"},
  {name = "TopoStats Team", email = "topostats@sheffield.ac.uk"},
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: napari",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Image Processing",
]
keywords = [
  "afm",
  "image processing",
]
requires-python = ">=3.10, <3.12"
dependencies = [
  "magicgui",
  "napari[all]",
  "qtpy",
  "tox",
  "topostats>=2.3.2,<2.4.0",
  "napari-AFMReader @ git+https://github.com/AFM-SPM/napari-AFMReader.git@main"
]

[project.optional-dependencies]
tests = [
  "pytest",
  "pytest-cov",
  "pytest-qt",
  "qtpy"
]
dev = [
  "black",
  # "codespell",
  "pre-commit",
  "pylint",
  "ruff",
]
pypi = [
  "build",
  "setuptools_scm[toml]",
  "wheel",
]

[tool.setuptools_scm]
write_to = "_version.py"

[tool.black]
line-length = 120
target-version = ['py310', 'py311']


[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
]

[tool.ruff.lint]

select = [
    "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]

ignore = [
    "E501", # line too long. let black handle this
    "UP006", "UP007", # type annotation. As using magicgui require runtime type annotation then we disable this.
    "SIM117", # flake8-simplify - some of merged with statements are not looking great with black, reanble after drop python 3.9
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = [
  "A", # flake8-builtins
  "B", # flake8-bugbear
  "C", #
  "D", # pydocstyle
  "E", # pycodestyle error
  "F",
  "I", # isort
  "NPY", # numpy
  "PT", # flake8-pytest-style
  "PTH", # flake8-use-pathlib
  "R",
  "S", #flake8-bandit
  "W", # pycodestyle warning
  "U",
  "UP", # pyupgrade
]
unfixable = []

# Numpy2 deprecation checks
extend-select = ["NPY201"]
preview = false

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["--cov", "-ra", "--strict-config", "--strict-markers"]
log_level = "INFO"
log_cli = true
log_cli_level = "INFO"
testpaths = [
    "src/napari_topostats/_tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning"
]
xfail_strict = true